# Supabase project config. Used by the Supabase CLI (`supabase link` / `db push`).
# Replace with your own project ref (Supabase → Project Settings → General).
project_id = "your-project-ref"

[db]
# Local dev DB (only used with `supabase start`). Production runs on the linked project.
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
